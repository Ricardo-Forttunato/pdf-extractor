services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      MAX_UPLOAD_BYTES: "10485760"
      JOB_RETENTION_HOURS: "24"
      OCR_TIMEOUT_MS: "120000"
      MAX_CONCURRENT_OCR_JOBS: "1"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 10
